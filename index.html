<!doctype html>
<html lang="my">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#2196F3" />
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('daily_ledger_theme');
          var theme =
            savedTheme === 'light' || savedTheme === 'dark'
              ? savedTheme
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = theme;
          var csMeta = document.querySelector('meta[name="color-scheme"]');
          if (csMeta) csMeta.setAttribute('content', theme);
          var tcMeta = document.querySelector('meta[name="theme-color"]');
          if (tcMeta) tcMeta.setAttribute('content', theme === 'dark' ? '#0B1220' : '#2196F3');
          var savedLang = localStorage.getItem('daily_ledger_language');
          if (savedLang === 'en' || savedLang === 'my' || savedLang === 'ko' || savedLang === 'ja') {
            document.documentElement.lang = savedLang;
          }
        } catch (e) {}
      })();
    </script>
    <title>နေ့စဉ် စာရင်း — Daily Ledger</title>
    <meta
      name="description"
      content="နေ့စဉ် စာရင်း (Daily Ledger) — Clean personal & daily cash-flow management with offline IndexedDB storage."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Daily Ledger" />

    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..600&family=DM+Serif+Display:ital@0;1&family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
